name: CreatorFlow AI - CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test backend imports & database initialization
        run: |
          cd backend
          python -c "from app.database.database import init_db; init_db(); print('Database tables successfully initialized')"

      - name: Run pytest automated test suite
        run: |
          cd backend
          pytest tests/test_unit_endpoints.py tests/test_security_resilience.py -v

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Vite production build
        run: |
          cd frontend
          npm run build
