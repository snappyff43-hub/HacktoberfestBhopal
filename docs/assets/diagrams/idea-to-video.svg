      <text x="69" y="89" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">STEP 4</text>
      <text x="69" y="118" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#0f172a" text-anchor="middle">Multi-Platform</text>
