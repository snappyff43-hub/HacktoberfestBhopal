      <circle cx="65" cy="40" r="24" fill="#ecfdf5"/>
      <text x="65" y="47" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">📅</text>
      <rect x="20" y="75" width="90" height="20" rx="10" fill="#059669"/>
