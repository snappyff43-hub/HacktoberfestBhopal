      <text x="65" y="118" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#0f172a" text-anchor="middle">Smart Calendar</text>
      <text x="65" y="142" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Persistent asset</text>
      <text x="65" y="156" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">library, calendar</text>
      <text x="65" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">&amp; Autopilot approval</text>
    </g>
