<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" fill="none">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="stepShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="360" rx="16" fill="#f8fafc"/>
  <rect x="1" y="1" width="998" height="358" rx="15" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Heading -->
  <g transform="translate(40, 25)">
    <text font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#0f172a">
      From One Idea to an Entire Content Campaign
    </text>
    <text y="24" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#64748b">
      The complete creator journey executed in CreatorFlow AI
    </text>
  </g>

  <!-- Flow Steps Container -->
  <g transform="translate(35, 80)">
    <!-- STEP 1 -->
    <g transform="translate(0, 0)">
      <rect width="138" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#stepShadow)"/>
      <circle cx="69" cy="40" r="24" fill="#ede9fe"/>
      <text x="69" y="47" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">💡</text>
      <rect x="24" y="75" width="90" height="20" rx="10" fill="#6366f1"/>
      <text x="69" y="89" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">STEP 1</text>
      <text x="69" y="118" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#0f172a" text-anchor="middle">One Idea</text>
      <text x="69" y="142" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Creator enters topic,</text>
      <text x="69" y="156" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">audience, tone &amp;</text>
      <text x="69" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">target platform</text>
    </g>

    <!-- Arrow 1-2 -->
    <path d="M142 115 L154 115" stroke="#6366f1" stroke-width="2"/>
    <polygon points="152,112 158,115 152,118" fill="#6366f1"/>

    <!-- STEP 2 -->
    <g transform="translate(160, 0)">
      <rect width="138" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#stepShadow)"/>
      <circle cx="69" cy="40" r="24" fill="#e0f2fe"/>
      <text x="69" y="47" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">📝</text>
      <rect x="24" y="75" width="90" height="20" rx="10" fill="#0284c7"/>
      <text x="69" y="89" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">STEP 2</text>
      <text x="69" y="118" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#0f172a" text-anchor="middle">AI Script Draft</text>
      <text x="69" y="142" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Local Gemma 4</text>
      <text x="69" y="156" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">generates hook,</text>
      <text x="69" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">scenes &amp; narration</text>
