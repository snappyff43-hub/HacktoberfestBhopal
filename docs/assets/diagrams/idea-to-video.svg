      <text x="69" y="118" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#0f172a" text-anchor="middle">HeyGen Video</text>
      <text x="69" y="142" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Select avatar, voice</text>
