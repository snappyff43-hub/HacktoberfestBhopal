    <g transform="translate(320, 0)">
      <rect width="138" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#stepShadow)"/>
      <circle cx="69" cy="40" r="24" fill="#ede9fe"/>
      <text x="69" y="47" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">✨</text>
      <rect x="24" y="75" width="90" height="20" rx="10" fill="#7c3aed"/>
      <text x="69" y="89" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">STEP 3</text>
      <text x="69" y="118" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#0f172a" text-anchor="middle">AI Refinement</text>
      <text x="69" y="142" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Cloud NVIDIA /</text>
      <text x="69" y="156" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Gemini polish with</text>
      <text x="69" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">side-by-side diff</text>
