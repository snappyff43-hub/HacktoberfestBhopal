<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon Emblem -->
  <g transform="translate(10, 10)">
    <!-- Base Rounded Square -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#logoGrad)" filter="url(#softGlow)"/>
    
    <!-- Outer Orbit Ring -->
    <circle cx="40" cy="40" r="28" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 4" stroke-opacity="0.6"/>
    
    <!-- Play Triangle / Idea Node -->
    <path d="M34 26 L54 40 L34 54 Z" fill="#ffffff" />
    
    <!-- Video / AI Sparkle accents -->
    <circle cx="26" cy="24" r="4" fill="#e0e7ff" />
    <circle cx="56" cy="56" r="4" fill="#e0e7ff" />
    <circle cx="58" cy="26" r="3" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <g transform="translate(105, 58)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="36" fill="#1e293b" letter-spacing="-0.5">
      Creator<tspan fill="url(#logoGrad)">Flow</tspan>
    </text>
    <rect x="220" y="-28" width="54" height="24" rx="6" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="247" y="-12" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#4f46e5" text-anchor="middle">AI</text>
  </g>
  <text x="108" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#64748b" letter-spacing="0.2">
    One Idea. Multiple Platforms. AI-Powered Videos.
  </text>
</svg>
