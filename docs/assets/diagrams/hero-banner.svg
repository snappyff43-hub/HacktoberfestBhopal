<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#eef2f7" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.3">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
  </g>

  <!-- Left Content: Title & Tagline -->
  <g transform="translate(60, 60)">
    <!-- Hackathon Badge -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="5" fill="#10b981"/>
    <text x="30" y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#475569">
      AI CONTENT CREATION USING HEYGEN
    </text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#0f172a" letter-spacing="-1">
      Creator<tspan fill="url(#primaryGrad)">Flow</tspan> <tspan font-weight="700" fill="#4f46e5">AI</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="130" font-family="system-ui, sans-serif" font-weight="600" font-size="22" fill="#334155">
      “One Idea. Multiple Platforms. AI-Powered Videos.”
    </text>

    <text x="0" y="170" font-family="system-ui, sans-serif" font-weight="400" font-size="15" fill="#64748b">
      The complete pipeline uniting Local Gemma 4, Cloud LLM Polish (NVIDIA &amp; Gemini),
    </text>
    <text x="0" y="195" font-family="system-ui, sans-serif" font-weight="400" font-size="15" fill="#64748b">
      and Official HeyGen V3 Interactive Avatar Video Synthesis.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>
      <text x="65" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#4338ca" text-anchor="middle">⚡ Local Gemma 4</text>

      <rect x="145" y="0" width="135" height="34" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>
      <text x="212" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#0284c7" text-anchor="middle">☁️ NVIDIA / Gemini</text>

      <rect x="295" y="0" width="125" height="34" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>
      <text x="357" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#7c3aed" text-anchor="middle">🎬 HeyGen V3 API</text>

      <rect x="435" y="0" width="135" height="34" rx="8" fill="#ffffff" filter="url(#cardShadow)"/>
      <text x="502" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#059669" text-anchor="middle">📅 Smart Autopilot</text>
    </g>
  </g>

  <!-- Right Visual: Flow Nodes Preview -->
  <g transform="translate(730, 50)">
    <!-- Stage Card 1: Input -->
    <g transform="translate(0, 0)">
      <rect width="380" height="70" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
      <rect x="15" y="15" width="40" height="40" rx="10" fill="#ede9fe"/>
      <text x="35" y="40" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">💡</text>
      <text x="68" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#1e293b">1. Creator Idea Input</text>
      <text x="68" y="49" font-family="system-ui, sans-serif" font-weight="400" font-size="12" fill="#64748b">Topic, target audience, tone, platform &amp; duration</text>
    </g>

    <!-- Connecting arrow 1 -->
    <path d="M190 70 L190 92" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="3 3"/>
    <polygon points="186,90 190,98 194,90" fill="#6366f1"/>

    <!-- Stage Card 2: AI Generation & Polish -->
    <g transform="translate(0, 100)">
      <rect width="380" height="70" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
      <rect x="15" y="15" width="40" height="40" rx="10" fill="#e0f2fe"/>
      <text x="35" y="40" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🧠</text>
      <text x="68" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#1e293b">2. Gemma 4 + Cloud LLM Polish</text>
      <text x="68" y="49" font-family="system-ui, sans-serif" font-weight="400" font-size="12" fill="#64748b">Local Ollama zero-cost draft + cloud polish &amp; diffs</text>
    </g>

    <!-- Connecting arrow 2 -->
    <path d="M190 170 L190 192" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="3 3"/>
    <polygon points="186,190 190,198 194,190" fill="#6366f1"/>

    <!-- Stage Card 3: HeyGen V3 Avatar Video -->
    <g transform="translate(0, 200)">
      <rect width="380" height="70" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
      <rect x="15" y="15" width="40" height="40" rx="10" fill="#fdf4ff"/>
      <text x="35" y="40" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🎥</text>
      <text x="68" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#1e293b">3. HeyGen V3 Avatar Video</text>
      <text x="68" y="49" font-family="system-ui, sans-serif" font-weight="400" font-size="12" fill="#64748b">Interactive avatar casting, voice pick &amp; credit safety</text>
    </g>
  </g>
</svg>
