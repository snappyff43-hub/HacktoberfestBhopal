<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" fill="none">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="700" rx="16" fill="#f8fafc"/>
  <rect x="1" y="1" width="998" height="698" rx="15" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(40, 35)">
    <rect width="36" height="36" rx="8" fill="url(#headerGrad)"/>
    <text x="18" y="24" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle">CF</text>
    <text x="48" y="24" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#0f172a">CreatorFlow AI — System Architecture</text>
    <text x="48" y="42" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#64748b">End-to-End Hybrid AI Content &amp; Video Production Engine</text>
  </g>

  <!-- LAYER 1: CLIENT FRONTEND -->
  <g transform="translate(40, 100)">
    <rect width="920" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect x="0" y="0" width="180" height="26" rx="6" fill="#e0e7ff"/>
    <text x="90" y="17" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#4338ca" text-anchor="middle">PRESENTATION LAYER</text>

    <!-- UI Components inside -->
    <g transform="translate(20, 35)">
      <!-- Box 1 -->
      <rect width="165" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="82" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#1e293b" text-anchor="middle">React 19 + Vite SPA</text>
      <text x="82" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Tailwind + Neumorphic UI</text>

      <!-- Box 2 -->
      <rect x="180" y="0" width="170" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="265" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#1e293b" text-anchor="middle">Motion Micro-Interactions</text>
      <text x="265" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Spring physics &amp; feedback</text>

      <!-- Box 3 -->
      <rect x="365" y="0" width="165" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="447" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#1e293b" text-anchor="middle">Studio &amp; Script Editor</text>
      <text x="447" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Word metric &amp; cloud diff</text>

      <!-- Box 4 -->
      <rect x="545" y="0" width="165" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="627" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#1e293b" text-anchor="middle">Avatar &amp; Render Lab</text>
      <text x="627" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Catalog &amp; Credit Gate</text>

      <!-- Box 5 -->
      <rect x="725" y="0" width="155" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="802" y="22" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#1e293b" text-anchor="middle">Autopilot Calendar</text>
      <text x="802" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Slot scheduler &amp; approval</text>
    </g>
  </g>

  <!-- DOWN ARROW 1 -->
  <path d="M500 190 L500 220" stroke="#6366f1" stroke-width="2.5"/>
  <polygon points="496,218 500,226 504,218" fill="#6366f1"/>
  <text x="510" y="210" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#4f46e5">REST / JSON (Axios)</text>

  <!-- LAYER 2: FASTAPI BACKEND API -->
  <g transform="translate(40, 225)">
    <rect width="920" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect x="0" y="0" width="180" height="26" rx="6" fill="#dbeafe"/>
    <text x="90" y="17" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#1e40af" text-anchor="middle">FASTAPI APPLICATION</text>

    <g transform="translate(20, 36)">
      <rect width="205" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="102" y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#1e293b" text-anchor="middle">REST Endpoints Router</text>
      <text x="102" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">/api/content, /api/heygen, /api/autopilot</text>

      <rect x="220" y="0" width="215" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="327" y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#1e293b" text-anchor="middle">Pydantic v2 Validation</text>
      <text x="327" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Strict schemas, DTOs &amp; error sanitizing</text>

      <rect x="450" y="0" width="215" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="557" y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#1e293b" text-anchor="middle">Async HTTPX Client Engine</text>
      <text x="557" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Connection pooling &amp; auto retry</text>

      <rect x="680" y="0" width="200" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="780" y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#1e293b" text-anchor="middle">Security &amp; Resilience</text>
      <text x="780" y="35" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Credit gate, fallback &amp; Sentry</text>
    </g>
  </g>

  <!-- ARROWS SPLIT TO ENGINES -->
  <path d="M220 320 L220 360" stroke="#6366f1" stroke-width="2"/>
  <polygon points="217,358 220,364 223,358" fill="#6366f1"/>

  <path d="M500 320 L500 360" stroke="#6366f1" stroke-width="2"/>
  <polygon points="497,358 500,364 503,358" fill="#6366f1"/>

  <path d="M780 320 L780 360" stroke="#6366f1" stroke-width="2"/>
  <polygon points="777,358 780,364 783,358" fill="#6366f1"/>

  <!-- LAYER 3: DUAL-MODE AI & MEDIA SERVICES -->
  <!-- Box A: Local LLM -->
  <g transform="translate(40, 365)">
    <rect width="280" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect x="0" y="0" width="140" height="24" rx="6" fill="#ede9fe"/>
    <text x="70" y="16" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#5b21b6" text-anchor="middle">LOCAL AI ENGINE</text>
    
    <text x="20" y="52" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#0f172a">Gemma 4 (Ollama)</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Model: gemma4:e2b-it-qat</text>
    <text x="20" y="88" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Zero cloud token cost &amp; total privacy</text>
    <text x="20" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• English, Hindi (Devanagari) &amp; Hinglish</text>
    <text x="20" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Scene visual &amp; hook breakdown</text>
  </g>

  <!-- Box B: Cloud AI Refinement -->
  <g transform="translate(340, 365)">
    <rect width="320" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect x="0" y="0" width="150" height="24" rx="6" fill="#e0f2fe"/>
    <text x="75" y="16" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#075985" text-anchor="middle">CLOUD REFINEMENT</text>
    
    <text x="20" y="52" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#0f172a">NVIDIA NIM &amp; Gemini Flash</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• NVIDIA: meta/llama-3.3-70b-instruct</text>
    <text x="20" y="88" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Gemini: gemini-3.8-flash resilience cascade</text>
    <text x="20" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Side-by-side script polish &amp; diffing</text>
    <text x="20" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Multi-platform packaging (YT, IG, LI, X)</text>
  </g>

  <!-- Box C: HeyGen V3 Video API -->
  <g transform="translate(680, 365)">
    <rect width="280" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect x="0" y="0" width="140" height="24" rx="6" fill="#fdf4ff"/>
    <text x="70" y="16" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#86198f" text-anchor="middle">VIDEO SYNTHESIS</text>
    
    <text x="20" y="52" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#0f172a">HeyGen V3 Official API</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• GET /v3/users/me (Credit Inspection)</text>
    <text x="20" y="88" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• Avatar &amp; Voice Catalog Browser</text>
    <text x="20" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• POST /v3/videos (Human Confirmed)</text>
    <text x="20" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• HTTP 402 Demo Simulation Fallback</text>
  </g>

  <!-- DOWN ARROWS TO PERSISTENCE -->
  <path d="M500 515 L500 550" stroke="#6366f1" stroke-width="2"/>
  <polygon points="497,548 500,554 503,548" fill="#6366f1"/>

  <!-- LAYER 4: PERSISTENCE & DISTRIBUTION -->
  <g transform="translate(40, 555)">
    <rect width="920" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
    <rect x="0" y="0" width="180" height="26" rx="6" fill="#ecfdf5"/>
    <text x="90" y="17" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#065f46" text-anchor="middle">DATA &amp; AUTOPILOT</text>

    <g transform="translate(20, 36)">
      <!-- SQLite / Postgres -->
      <rect width="270" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="135" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#1e293b" text-anchor="middle">Relational Database Layer</text>
      <text x="135" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">SQLite default | PostgreSQL / Supabase</text>

      <!-- Tables -->
      <rect x="290" y="0" width="300" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="440" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#1e293b" text-anchor="middle">SQLAlchemy Core Entities</text>
      <text x="440" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">projects, generated_scripts, video_jobs, scheduled_posts</text>

      <!-- Autopilot -->
      <rect x="610" y="0" width="270" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="745" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#1e293b" text-anchor="middle">Smart Autopilot Engine</text>
      <text x="745" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Posting preferences, slot detection &amp; approval gate</text>
    </g>
  </g>
</svg>
