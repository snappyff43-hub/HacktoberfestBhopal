<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" fill="none">
  <defs>
    <linearGradient id="depGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="depShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="960" height="480" rx="16" fill="#f8fafc"/>
  <rect x="1" y="1" width="958" height="478" rx="15" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title -->
  <g transform="translate(40, 30)">
    <rect width="32" height="32" rx="8" fill="url(#depGrad)"/>
    <text x="16" y="22" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🚀</text>
    <text x="44" y="22" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#0f172a">CreatorFlow AI — Deployment Topologies</text>
    <text x="44" y="38" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#64748b">Seamless Transition from Local Hackathon Environment to Cloud Production</text>
  </g>

  <!-- COLUMN 1: LOCAL RUNTIME -->
  <g transform="translate(40, 85)">
    <rect width="420" height="360" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" filter="url(#depShadow)"/>
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#ede9fe"/>
    <text x="90" y="16" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#5b21b6" text-anchor="middle">LOCAL RUNTIME (HACKATHON)</text>

    <g transform="translate(20, 45)">
      <!-- Box 1 -->
      <rect width="380" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0f172a">Frontend: Vite Dev Server</text>
      <text x="15" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#475569">http://localhost:5173 • Hot Module Replacement (HMR)</text>

      <!-- Box 2 -->
      <rect y="75" width="380" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="99" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0f172a">Backend: FastAPI on Uvicorn</text>
      <text x="15" y="117" font-family="system-ui, sans-serif" font-size="11" fill="#475569">http://127.0.0.1:8000 • Interactive Swagger docs at /docs</text>

      <!-- Box 3 -->
      <rect y="150" width="380" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="174" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0f172a">AI Inference: Local Ollama</text>
      <text x="15" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#475569">http://localhost:11434 • gemma4:e2b-it-qat (Offline)</text>

      <!-- Box 4 -->
      <rect y="225" width="380" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="249" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0f172a">Database: Embedded SQLite</text>
      <text x="15" y="267" font-family="system-ui, sans-serif" font-size="11" fill="#475569">creatorflow.db (Zero external DB infra needed)</text>
    </g>
  </g>

  <!-- COLUMN 2: CLOUD PRODUCTION -->
  <g transform="translate(500, 85)">
    <rect width="420" height="360" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#depShadow)"/>
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#e0f2fe"/>
    <text x="90" y="16" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#0369a1" text-anchor="middle">CLOUD PRODUCTION</text>

    <g transform="translate(20, 45)">
      <!-- Cloud Box 1 -->
      <rect width="380" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0f172a">Frontend: Vercel Global Edge</text>
      <text x="15" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Automated CI/CD from Git • SPA routing via vercel.json</text>

      <!-- Cloud Box 2 -->
      <rect y="75" width="380" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="99" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0f172a">Backend: Render / Railway</text>
      <text x="15" y="117" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Docker / Python 3.11 • Managed via backend/render.yaml</text>

      <!-- Cloud Box 3 -->
      <rect y="150" width="380" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="174" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0f172a">AI Inference: NVIDIA NIM &amp; Gemini</text>
      <text x="15" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Serverless Cloud LLM API with automated retry &amp; fallback</text>

      <!-- Cloud Box 4 -->
      <rect y="225" width="380" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="15" y="249" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0f172a">Database: Supabase / PostgreSQL</text>
      <text x="15" y="267" font-family="system-ui, sans-serif" font-size="11" fill="#475569">DATABASE_URL connection pooling &amp; SSL encryption</text>
    </g>
  </g>
</svg>
